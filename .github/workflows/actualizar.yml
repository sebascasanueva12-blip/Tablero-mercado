name: Actualizar datos de mercado

on:
  schedule:
    # Lunes a viernes a las 22:30 UTC (16:30 hora del centro de México),
    # después del cierre de BMV y de Nueva York
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # permite correrlo a mano con un botón

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr el script
        run: python scripts/Datos/datos_mercado.py

      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos de mercado $(date -u +'%Y-%m-%d')"
          git push
